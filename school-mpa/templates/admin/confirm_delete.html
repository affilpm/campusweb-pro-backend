{% extends 'admin/base_admin.html' %}

{% block page_title %}Delete {{ type }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center">
        <div class="w-16 h-16 mx-auto mb-6 bg-red-100 rounded-full flex items-center justify-center">
            <svg class="w-8 h-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>
        
        <h2 class="text-xl font-bold text-gray-900 mb-2">Delete {{ type }}?</h2>
        <p class="text-gray-600 mb-6">Are you sure you want to delete "<strong>{{ object }}</strong>"? This action cannot be undone.</p>
        
        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <button type="submit" class="px-6 py-3 bg-red-600 text-white font-semibold rounded-xl hover:bg-red-700 transition-colors">
                Yes, Delete
            </button>
            <a href="javascript:history.back()" class="px-6 py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition-colors">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
