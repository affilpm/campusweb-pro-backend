{% extends 'admin/base_admin.html' %}

{% block page_title %}Site Settings{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-8">
        <h2 class="text-xl font-bold text-gray-900 mb-6">Site Settings</h2>
        
        <form method="post" enctype="multipart/form-data" class="space-y-8">
            {% csrf_token %}
            
            <!-- Basic Info -->
            <div class="border-b border-gray-100 pb-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Basic Information</h3>
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">School Name</label>
                        <input type="text" name="school_name" value="{{ form.instance.school_name|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Motto / Tagline</label>
                        <input type="text" name="school_motto" value="{{ form.instance.school_motto|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
                        <textarea name="school_address" rows="2" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">{{ form.instance.school_address|default:'' }}</textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" name="school_email" value="{{ form.instance.school_email|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone (comma-separated for multiple)</label>
                        <textarea name="school_phone" rows="2" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">{{ form.instance.school_phone|default:'' }}</textarea>
                    </div>
                </div>
            </div>
            
            <!-- Branding -->
            <div class="border-b border-gray-100 pb-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Branding</h3>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">School Logo</label>
                        <input type="file" name="school_logo" accept="image/*" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                        {% if form.instance.school_logo %}<img src="{{ form.instance.school_logo.url }}" alt="Logo" class="h-16 mt-3 rounded">{% endif %}
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Favicon</label>
                        <input type="file" name="favicon" accept="image/*" class="w-full px-4 py-3 border border-gray-200 rounded-xl">
                        {% if form.instance.favicon %}<img src="{{ form.instance.favicon.url }}" alt="Favicon" class="h-8 mt-3">{% endif %}
                    </div>
                </div>
            </div>
            
            <!-- Social Media -->
            <div class="border-b border-gray-100 pb-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Social Media</h3>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Facebook URL</label>
                        <input type="url" name="facebook_url" value="{{ form.instance.facebook_url|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Instagram URL</label>
                        <input type="url" name="instagram_url" value="{{ form.instance.instagram_url|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">YouTube URL</label>
                        <input type="url" name="youtube_url" value="{{ form.instance.youtube_url|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">LinkedIn URL</label>
                        <input type="url" name="linkedin_url" value="{{ form.instance.linkedin_url|default:'' }}"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            </div>
            
            <!-- Footer -->
            <div>
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Footer</h3>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Footer Text</label>
                    <textarea name="footer_text" rows="2" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500">{{ form.instance.footer_text|default:'' }}</textarea>
                </div>
            </div>
            
            <div class="pt-4">
                <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors">Save Settings</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
